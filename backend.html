<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Week Planner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Staff Week Planner (Editable)</h1>

  <div id="week-planner">
    <!-- Monday to Friday Columns -->
    <div id="monday" class="day-block">
      <div class="day">Monday</div>
    </div>
    <div id="tuesday" class="day-block">
      <div class="day">Tuesday</div>
    </div>
    <div id="wednesday" class="day-block">
      <div class="day">Wednesday</div>
    </div>
    <div id="thursday" class="day-block">
      <div class="day">Thursday</div>
    </div>
    <div id="friday" class="day-block">
      <div class="day">Friday</div>
    </div>
  </div>

  <div id="staff-selector">
    <label for="staff">Select Staff Member:</label>
    <select id="staff">
      <option value="staff1">Staff 1</option>
      <option value="staff2">Staff 2</option>
      <option value="staff3">Staff 3</option>
      <option value="staff4">Staff 4</option>
      <option value="staff5">Staff 5</option>
      <option value="staff6">Staff 6</option>
      <option value="staff7">Staff 7</option>
    </select>
  </div>

  <button id="save-schedule">Save Schedule</button>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script src="backend.js"></script>
</body>
</html>
