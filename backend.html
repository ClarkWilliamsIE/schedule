<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Week Planner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Staff Week Planner (Editable)</h1>

  <div id="week-planner">
    <!-- Day Columns -->
    <div id="monday" class="day">Monday</div>
    <div id="tuesday" class="day">Tuesday</div>
    <div id="wednesday" class="day">Wednesday</div>
    <div id="thursday" class="day">Thursday</div>
    <div id="friday" class="day">Friday</div>

    <!-- Time Blocks for Each Day -->
    <div class="time-blocks">
      <div class="time-block" data-time="09:00 - 09:30">09:00 - 09:30</div>
      <div class="time-block" data-time="09:30 - 10:00">09:30 - 10:00</div>
      <div class="time-block" data-time="10:00 - 10:30">10:00 - 10:30</div>
      <div class="time-block" data-time="10:30 - 11:00">10:30 - 11:00</div>
      <div class="time-block" data-time="11:00 - 11:30">11:00 - 11:30</div>
      <div class="time-block" data-time="11:30 - 12:00">11:30 - 12:00</div>
      <div class="time-block" data-time="12:00 - 12:30">12:00 - 12:30</div>
      <div class="time-block" data-time="12:30 - 13:00">12:30 - 13:00</div>
      <div class="time-block" data-time="13:00 - 13:30">13:00 - 13:30</div>
      <div class="time-block" data-time="13:30 - 14:00">13:30 - 14:00</div>
      <div class="time-block" data-time="14:00 - 14:30">14:00 - 14:30</div>
      <div class="time-block" data-time="14:30 - 15:00">14:30 - 15:00</div>
      <div class="time-block" data-time="15:00 - 15:30">15:00 - 15:30</div>
      <div class="time-block" data-time="15:30 - 16:00">15:30 - 16:00</div>
      <div class="time-block" data-time="16:00 - 16:30">16:00 - 16:30</div>
      <div class="time-block" data-time="16:30 - 17:00">16:30 - 17:00</div>
    </div>
  </div>

  <div id="staff-selector">
    <label for="staff">Select Staff Member:</label>
    <select id="staff">
      <option value="staff1">Staff 1</option>
      <option value="staff2">Staff 2</option>
      <option value="staff3">Staff 3</option>
      <option value="staff4">Staff 4</option>
      <option value="staff5">Staff 5</option>
      <option value="staff6">Staff 6</option>
      <option value="staff7">Staff 7</option>
    </select>
  </div>

  <button id="save-schedule">Save Schedule</button>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script src="backend.js"></script>
</body>
</html>
