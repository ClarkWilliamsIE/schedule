<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Week Planner (View Only)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Staff Week Planner (View Only)</h1>

  <div id="week-planner">
    <!-- Monday to Friday Columns -->
    <div id="monday" class="day-block">
      <div class="day">Monday</div>
    </div>
    <div id="tuesday" class="day-block">
      <div class="day">Tuesday</div>
    </div>
    <div id="wednesday" class="day-block">
      <div class="day">Wednesday</div>
    </div>
    <div id="thursday" class="day-block">
      <div class="day">Thursday</div>
    </div>
    <div id="friday" class="day-block">
      <div class="day">Friday</div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script src="frontend.js"></script>
</body>
</html>
